<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L'Oréal | Routine Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>Build your routine</h1>
  <p>Pick products from L'Oréal brands, then let your advisor shape them into a routine.</p>
  <button id="rtlToggle" class="ghost" aria-pressed="false">Switch to RTL</button>
</header>

<main>
  <section class="browse">
    <div class="filters">
      <select id="categoryFilter" aria-label="Filter by category"><option value="">All categories</option></select>
      <input id="searchInput" type="search" placeholder="Search by name or keyword" aria-label="Search products">
    </div>
    <div id="productsContainer" class="grid"></div>

    <div class="selected">
      <div class="selected-head">
        <h2>Selected products</h2>
        <button id="clearAll" class="ghost">Clear all</button>
      </div>
      <ul id="selectedList"></ul>
      <button id="generateRoutine" class="primary">Generate routine</button>
    </div>
  </section>

  <section class="chat" aria-label="Routine advisor">
    <h2>Your advisor</h2>
    <div id="chatWindow" class="chat-window" aria-live="polite">
      <p class="hint">Select products, then choose Generate routine. Afterwards, ask anything about skincare, haircare, makeup or fragrance.</p>
    </div>
    <form id="chatForm">
      <input id="userInput" placeholder="Ask a follow-up question" autocomplete="off" required>
      <button class="primary" type="submit">Send</button>
    </form>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
